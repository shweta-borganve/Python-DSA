name: Run Unit Tests

# Triggers the workflow on push or pull request to any branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your repository code so GitHub can see it
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Python inside the GitHub runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14' # Matches the Python version you are using

    # Step 3: Install dependencies (pytest)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # Step 4: Run your test suite automatically
    - name: Run pytest
      run: |
        pytest 